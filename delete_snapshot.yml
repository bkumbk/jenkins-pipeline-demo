---
- name: Delete VM Snapshot on vCenter
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Fetch all VMs from vCenter using dynamic inventory
      community.vmware.vmware_vm_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
      delegate_to: localhost
      register: all_vms

    - name: Show all VMs fetched from vCenter
      debug:
        msg: "Found VM: {{ item.guest_name }}"
      loop: "{{ all_vms.virtual_machines }}"

    - name: Find target VM
      set_fact:
        target_vm: "{{ all_vms.virtual_machines | selectattr('guest_name', 'equalto', vm_name) | list | first }}"

    - name: Fail if VM not found
      fail:
        msg: "VM '{{ vm_name }}' not found in vCenter!"
      when: target_vm is not defined

    - name: Show target VM details
      debug:
        msg: |
          VM Name  : {{ target_vm.guest_name }}
          MOID     : {{ target_vm.moid }}
          Power    : {{ target_vm.power_state }}
          IP       : {{ target_vm.ip_address }}

    - name: Delete snapshot
      community.vmware.vmware_guest_snapshot:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        datacenter: "{{ datacenter_name }}"
        moid: "{{ target_vm.moid }}"
        state: absent
        snapshot_name: "{{ snapshot_name }}"
      delegate_to: localhost

    - name: Print result
      debug:
        msg: "Snapshot '{{ snapshot_name }}' deleted from '{{ vm_name }}' successfully!"
